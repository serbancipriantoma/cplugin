# cplugin project configuration. Commit this file.
# Paths are glob patterns relative to the project root.

[workflow]
tests_first = true      # tests, then Red, then code, then Green; false = tests and code in parallel

[files]
# Edits to these need an active task. code_extensions replaces the built-in
# list (web, mobile, game and general-purpose languages); extra_ adds to it.
extra_code_extensions = []
code_dirs = ["bin", "scripts"]   # everything in these directories counts as code, except docs and data

[roles.worker]
# Claude sub-agent that writes production code.
model = "opus"                      # opus | sonnet | haiku | fable | full model ID
paths = ["src/**", "app/**"]        # where it may write code
max_parallel = 1                    # how many workers may run at once

[roles.tester]
# Claude sub-agent that writes tests from the step's criteria, without seeing the new code.
model = "sonnet"
paths = ["tests/**", "**/test_*.py", "**/*_test.*", "**/*.test.*", "**/*.spec.*"]

[roles.main]
# The main session. It coordinates and never writes code or tests itself.
# The active task.md is always writable for it.
paths = ["MIND_MAP.md", "mindmap/**"]

[judges]
mode = "panel"          # single = first available seat; panel = every seat, in parallel
timeout_min = 15
fallback = "claude"     # when no external CLI works: read-only Claude judge; "none" = fail

[[judges.seat]]
provider = "codex"
model = ""              # empty = the CLI's default model

[[judges.seat]]
provider = "agy"
model = ""

[tests]
command = ""            # e.g. "npm test" or "pytest -q"; empty = Claude finds it from the project

[review]
debug_patterns = ["print(", "console.log(", "debugger", "breakpoint()"]
