# foreman project configuration. Commit this file.
# Paths are glob patterns relative to the project root.

[workflow]
tests_first = true      # tests, then Red, then code, then Green; false = tests and code in parallel

[files]
# Edits to these need an active task. code_extensions replaces the built-in
# list (web, mobile, game and general-purpose languages); extra_ adds to it.
extra_code_extensions = []
code_dirs = ["bin", "scripts"]   # everything in these directories counts as code, except docs and data

# Roles. While a task is active each role writes only what it owns: a code
# file matching the tester's paths is a test, any other code file matching the
# worker's paths is production code. Files that are not code (docs, data,
# images) are open to every role, except the main agent's own paths.
# model: opus | sonnet | haiku | fable, passed when the agent is started.

[roles.worker]
# Claude sub-agent that writes production code.
model = "opus"
paths = ["**"]                      # narrow it (e.g. ["src/**"]) to fence the worker in
max_parallel = 1                    # workers at once; raise it only for steps that touch different files

[roles.tester]
# Claude sub-agent that writes tests from the step's criteria, before the code exists.
model = "sonnet"
paths = ["tests/**", "test/**", "**/__tests__/**", "**/test_*.py", "**/*_test.*",
         "**/*.test.*", "**/*.spec.*"]

[roles.main]
# The main session. It coordinates and never writes code or tests itself.
# The active task.md is always writable for it.
paths = ["MIND_MAP.md", "mindmap/**"]

[judges]
mode = "panel"          # single = first available seat; panel = every seat, in parallel
timeout_min = 8         # per judge; keep it under 10, the longest a Claude Code command may run
fallback = "claude"     # when no judge CLI is on PATH: `claude -p` limited to Read/Grep/Glob; "none" = fail

[[judges.seat]]
provider = "codex"
model = ""              # empty = the CLI's default; `agy models` lists agy's

[[judges.seat]]
provider = "agy"
model = ""

[tests]
command = ""            # e.g. "npm test" or "pytest -q"; empty = Claude finds it from the project

[locker]
# A folder git never sees: what you hand Claude (an image, a PDF) and what it hands back.
dir = "locker"          # one folder name; /foreman:init creates it

[review]
debug_patterns = ["print(", "console.log(", "debugger", "breakpoint()"]
